<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桌游包间预约排期</title>
  <style>
    :root{
      --bg:#f7f7f5;
      --panel:#ffffff;
      --panel-2:#fbfbfa;
      --text:#191919;
      --muted:#6f6e69;
      --border:#e8e7e4;
      --blue:#4f8cc9;
      --blue-2:#edf4fb;
      --orange:#c78a47;
      --green:#4f9371;
      --pink:#e9e4dd;
      --lavender:#efefed;
      --danger:#d44c47;
      --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.03);
      --shadow-soft:0 1px 2px rgba(15,23,42,.03);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text)
    }
    input:focus,select:focus,textarea:focus,button:focus-visible{
      outline:none;
      box-shadow:0 0 0 3px rgba(79,140,201,.14);
      border-color:#c8d9ea;
    }
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{max-width:1480px;margin:auto;padding:20px}
    .topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
    .date-controls,.auth-panel,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .date-controls,.auth-panel{flex:1 1 320px}
    input,select,.btn{
      border:1px solid var(--border);
      background:var(--panel);
      border-radius:8px;
      padding:9px 12px;
      box-shadow:var(--shadow-soft);
      color:var(--text)
    }
    .btn{
      transition:background .15s ease, border-color .15s ease, box-shadow .15s ease, transform .15s ease;
      font-weight:600;
    }
    .btn:hover{background:#f7f7f6;box-shadow:var(--shadow-soft)}
    .btn.primary{
      background:#191919;
      border-color:#191919;
      color:#fff;
      font-weight:700
    }
    .btn.primary:hover{background:#2a2a2a}
    .btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;background:#fff}
    .icon-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:30px;
      height:30px;
      padding:0;
      border:0;
      border-radius:999px;
      background:transparent;
      box-shadow:none;
      color:var(--muted);
    }
    .icon-btn:hover{background:#f1f1ef;box-shadow:none}
    .chip{
      display:inline-flex;align-items:center;gap:6px;
      padding:8px 10px;border-radius:8px;
      background:#fcfcfb;
      border:1px solid var(--border);
      color:var(--muted);
      box-shadow:var(--shadow-soft)
    }
    .chip.status-chip{
      gap:8px;
    }
    .chip.status-chip::before{
      content:'';
      width:8px;
      height:8px;
      border-radius:999px;
      background:currentColor;
      opacity:.75;
      flex:0 0 auto;
    }
    .chip.status-ok{
      color:#2d6a4f;
      background:#f4f8f5;
      border-color:#dde9e0;
    }
    .chip.status-warn{
      color:#8a5a28;
      background:#fbf6f0;
      border-color:#eadacd;
    }
    .chip.status-error{
      color:#ab433f;
      background:#fbf4f3;
      border-color:#ecd7d5;
    }
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
    .card{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:8px;
      padding:16px;
      box-shadow:none
    }
    .card .label{font-size:12px;color:var(--muted);letter-spacing:.03em}
    .card .value{font-size:28px;font-weight:700;margin-top:6px;letter-spacing:-.03em}
    .timeline-card{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:8px;
      overflow:hidden;
      box-shadow:none
    }
    .timeline-head{
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
      background:#ffffff
    }
    .view-switch{
      display:inline-flex;
      gap:6px;
      padding:4px;
      border:1px solid var(--border);
      border-radius:999px;
      background:#f7f7f5;
      box-shadow:none;
    }
    .view-switch .btn{
      min-width:82px;
      padding:8px 12px;
      border-radius:999px;
      border-color:transparent;
      background:transparent;
      color:var(--muted);
    }
    .view-switch .btn.active{
      background:#ffffff;
      color:var(--text);
      font-weight:700;
      border-color:var(--border);
      box-shadow:var(--shadow-soft);
    }
    .legend{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
    .dot{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:5px}
    .scroll{overflow-x:auto}
    .timeline{min-width:1120px}
    .grid-row{display:grid;grid-template-columns:132px 1fr;min-height:60px;border-bottom:1px solid var(--border)}
    .room-label{padding:14px 12px;border-right:1px solid var(--border);background:#ffffff}
    .room-label b{display:block;font-size:18px;letter-spacing:-.02em}
    .room-label span{font-size:12px;color:var(--muted)}
    .time-head{
      display:grid;
      grid-template-columns:repeat(11,minmax(0,1fr));
      background:#ffffff;
      border-bottom:1px solid var(--border);
    }
    .time-head div{
      padding:12px 4px;
      font-size:13px;
      font-weight:500;
      color:var(--muted);
      border-left:1px solid var(--border);
      text-align:center;
      white-space:nowrap;
    }
    .time-head .end-label{
      border-left:1px solid var(--border);
      background:#fff;
    }
    .track{
      position:relative;
      background:
      repeating-linear-gradient(to right, transparent 0, transparent calc(9.090909% - 1px), #ecebe8 calc(9.090909% - 1px), #ecebe8 9.090909%)}
    .booking{
      position:absolute;top:8px;height:58px;border:0;border-radius:8px;padding:5px 8px;
      text-align:left;color:#fff;overflow:hidden;box-shadow:none
    }
    .booking.confirmed{background:#6f9fd1;color:#fff}
    .booking.pending{background:#e7d7c2;color:#5f5140}
    .booking strong,.booking span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .booking span{font-size:11px;opacity:.92;margin-top:2px}
    .list-view{
      display:grid;
      gap:12px;
      padding:14px;
      background:#fafaf9;
    }
    .list-room{
      border:1px solid var(--border);
      border-radius:8px;
      background:#fff;
      overflow:hidden;
      box-shadow:none;
    }
    .list-room-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      background:#fbfbfa;
      border-bottom:1px solid var(--border);
    }
    .list-room-head b{display:block}
    .list-room-head span{font-size:12px;color:var(--muted)}
    .list-bookings{
      display:grid;
      gap:10px;
      padding:12px;
    }
    .list-booking{
      width:100%;
      border:1px solid transparent;
      border-radius:8px;
      padding:12px;
      text-align:left;
      background:#fff;
      box-shadow:none;
    }
    .list-booking.confirmed{
      background:#f2f7fc;
      border-color:#d7e4f0;
      color:#355877;
    }
    .list-booking.pending{
      background:#fbf7f1;
      border-color:#eadfd0;
      color:#7c6448;
    }
    .list-booking strong,.list-booking span{
      display:block;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .list-booking span{
      margin-top:4px;
      font-size:12px;
      opacity:.9;
    }
    .list-empty{
      padding:16px 14px;
      color:var(--muted);
      font-size:13px;
    }
    dialog{width:min(92vw,560px);border:1px solid var(--border);border-radius:8px;padding:0;box-shadow:0 18px 48px rgba(15,23,42,.08)}
    dialog::backdrop{background:rgba(15,23,42,.12);backdrop-filter:blur(2px)}
    .dialog-body{padding:16px}
    .dialog-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .dialog-title h2{margin:0}
    .dialog-title p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
    label{font-size:13px;color:#5c5470}
    label input,label select,label textarea{width:100%;margin-top:5px}
    label textarea{
      min-height:140px;
      resize:vertical;
      border:1px solid var(--border);
      background:#ffffff;
      border-radius:8px;
      padding:10px 12px;
      color:var(--text);
      font:inherit;
      line-height:1.4
    }
    .full{grid-column:1/-1}
    .message{margin-top:10px;padding:9px;border-radius:8px;font-size:13px;display:none}
    .message.error{display:block;border:1px solid #f5c2c7;background:#fff2f4;color:var(--danger)}
    .message.success{display:block;border:1px solid #c8e6c9;background:#f0fbf2;color:#2e7d32}
    .dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
    .result-list{display:grid;gap:8px;margin-top:12px}
    .result{border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;background:#fff;box-shadow:var(--shadow-soft)}
    .badge{padding:4px 8px;border-radius:999px;background:#f1f3f5;color:#5f6773;font-size:12px}
    #authDialog{
      width:min(92vw,430px);
      overflow:hidden;
      background:#ffffff;
    }
    .auth-shell{
      padding:0;
      background:transparent;
    }
    .auth-hero{
      position:relative;
      padding:24px 22px 18px;
      background:#ffffff;
      border-bottom:1px solid var(--border);
    }
    .auth-mark{
      width:48px;
      height:48px;
      border-radius:16px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:#191919;
      color:#fff;
      box-shadow:none;
    }
    .auth-mark svg{
      width:24px;
      height:24px;
      stroke:currentColor;
    }
    .auth-title{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      margin-top:16px;
    }
    .auth-copy h2{
      margin:0;
      font-size:28px;
      line-height:1.1;
      letter-spacing:-.03em;
    }
    .auth-copy p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
    }
    .auth-tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:18px;
      padding:4px;
      border:1px solid var(--border);
      border-radius:999px;
      background:#f7f7f5;
      backdrop-filter:none;
    }
    .auth-tabs .tab{
      flex:1;
      min-height:42px;
      border-radius:999px;
      border-color:transparent;
      background:transparent;
      color:var(--muted);
      font-weight:700;
    }
    .tab.active{
      background:#ffffff;
      border-color:var(--border);
      color:var(--text);
      box-shadow:var(--shadow-soft);
    }
    .auth-forms{
      padding:18px 22px 22px;
    }
    .auth-forms .form-grid{
      grid-template-columns:1fr;
      gap:14px;
      margin-top:0;
    }
    .auth-field{
      font-size:12px;
      font-weight:700;
      color:#6b6480;
      letter-spacing:.02em;
    }
    .auth-field input{
      width:100%;
      margin-top:8px;
      min-height:52px;
      padding:14px 16px;
      border:1px solid var(--border);
      border-radius:16px;
      background:#fff;
      color:var(--text);
      transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .auth-field input::placeholder{
      color:#b0a7bb;
    }
    .auth-field input:focus{
      outline:none;
      border-color:#c8d9ea;
      background:#fff;
      box-shadow:0 0 0 4px rgba(79,140,201,.12);
    }
    .auth-message{
      margin-top:14px;
    }
    .auth-actions{
      margin-top:18px;
      display:grid;
      justify-content:stretch;
    }
    .auth-submit{
      width:100%;
      min-height:52px;
      border-radius:16px;
      font-size:16px;
      font-weight:800;
      box-shadow:none;
    }
    .auth-note{
      margin:12px 4px 0;
      text-align:center;
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
    }
    .auth-hint{font-size:12px;color:var(--muted);margin-top:8px}
    .empty-state{
      display:grid;
      place-items:center;
      min-height:280px;
      padding:28px 20px;
      color:var(--muted);
      text-align:center;
      background:#f8f8f7;
    }
    .empty-card{
      width:min(100%, 440px);
      padding:24px 20px;
      border:1px solid var(--border);
      border-radius:8px;
      background:#fff;
      box-shadow:none;
    }
    .empty-card strong{
      display:block;
      font-size:20px;
      color:var(--text);
      margin-bottom:8px;
    }
    .empty-card p{
      margin:0;
      font-size:14px;
      line-height:1.6;
    }
    .empty-actions{
      display:flex;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
      margin-top:16px;
    }
    @media(max-width:720px){
      .app{padding:12px}
      .topbar,.actions{display:grid;grid-template-columns:1fr}
      .date-controls,.auth-panel,.actions{width:100%}
      .date-controls .btn,.auth-panel .btn,.actions .btn,.view-switch .btn{min-height:42px}
      .date-controls input{width:100%}
      .auth-panel{gap:6px}
      .chip{min-height:40px;justify-content:center}
      .cards{grid-template-columns:1fr}
      .card{padding:12px}
      .timeline-head{padding:10px 12px;align-items:stretch}
      .timeline{min-width:980px}
      .grid-row{grid-template-columns:104px 1fr;min-height:56px}
      .room-label{padding:10px}
      .booking{height:52px;padding:4px 7px}
      .booking strong{font-size:13px}
      .booking span{font-size:10px}
      .legend{width:100%;justify-content:flex-start}
      .view-switch{width:100%;justify-content:space-between}
      .view-switch .btn{flex:1}
      .list-view{padding:12px}
      .list-room-head,.list-bookings{padding-left:10px;padding-right:10px}
      dialog{
        width:100vw;
        max-width:none;
        height:100dvh;
        max-height:none;
        margin:0;
        border-radius:0;
        border-left:0;
        border-right:0;
        border-bottom:0;
      }
      .dialog-body{
        min-height:100dvh;
        display:flex;
        flex-direction:column;
        padding:16px 14px 18px;
      }
      .form-grid{grid-template-columns:1fr}
      .full{grid-column:auto}
      .empty-state{
        min-height:220px;
        padding:18px 12px;
      }
      .empty-card{
        width:100%;
        padding:18px 14px;
      }
      .empty-card strong{
        font-size:18px;
      }
      .empty-card p{
        font-size:13px;
      }
      .empty-actions .btn{
        flex:1 1 140px;
      }
      .dialog-actions{
        margin-top:auto;
        padding-top:14px;
        position:sticky;
        bottom:0;
        background:linear-gradient(180deg, rgba(255,254,252,.75), #fffefc 26%);
      }
      #authDialog{background:#ffffff}
      .auth-shell{
        min-height:100dvh;
        padding:0;
      }
      .auth-hero{
        padding:20px 16px 16px;
      }
      .auth-copy h2{
        font-size:24px;
      }
      .auth-copy p{
        font-size:13px;
      }
      .auth-forms{
        padding:16px 16px 20px;
        flex:1;
        display:flex;
        flex-direction:column;
      }
      .auth-actions{
        margin-top:auto;
        padding-top:18px;
        position:sticky;
        bottom:0;
        background:linear-gradient(180deg, rgba(255,255,255,.72), #ffffff 28%);
      }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="date-controls">
      <input id="dateInput" type="date" value="2026-08-29">
    </div>
    <div class="auth-panel">
      <span class="chip status-chip status-warn" id="dbStatus">???????</span>
      <span class="chip" id="authStatus">未登录</span>
      <button class="btn" id="loginBtn">登录</button>
      <button class="btn" id="registerBtn">注册</button>
      <button class="btn" id="logoutBtn" style="display:none">退出</button>
    </div>
  </div>

  <div class="actions" id="actionsBar" style="margin-bottom:18px">
    <button class="btn" id="findBtn">查找空闲包间</button>
    <button class="btn primary" id="newBtn">+ 新增预约</button>
  </div>

  <div class="cards" id="summaryCards">
    <div class="card"><div class="label">预约数量</div><div class="value" id="bookingCount">0</div></div>
    <div class="card"><div class="label">可用包间</div><div class="value" id="availableRooms">0</div></div>
    <div class="card"><div class="label">即将结束的预约</div><div class="value" style="font-size:20px" id="nextEnding">—</div></div>
  </div>

  <div class="timeline-card" id="timelineCard">
    <div class="timeline-head">
      <div class="view-switch" role="tablist" aria-label="视图切换">
        <button type="button" class="btn active" id="timelineViewBtn">时间轴</button>
        <button type="button" class="btn" id="listViewBtn">列表</button>
      </div>
      <div class="legend">
        <span><i class="dot" style="background:var(--blue)"></i>已确认</span>
        <span><i class="dot" style="background:var(--orange)"></i>待确认</span>
      </div>
    </div>
    <div class="scroll">
      <div class="timeline" id="timeline"></div>
    </div>
  </div>
</div>

<dialog id="bookingDialog">
  <form id="bookingForm" class="dialog-body">
    <div class="dialog-title">
      <div>
        <h2 id="bookingDialogTitle">新增预约</h2>
      </div>
      <button type="button" class="icon-btn" data-close="bookingDialog" aria-label="关闭" title="关闭">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false">
          <path d="M4 4L14 14M14 4L4 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <label class="full">粘贴 WhatsApp 文本
      <textarea id="whatsappPaste" placeholder="把顾客发来的预约内容直接贴在这里，然后点“智能识别”"></textarea>
    </label>
    <div class="dialog-actions" style="justify-content:flex-start;margin-top:8px">
      <button type="button" class="btn" id="whatsappParseBtn">智能识别</button>
    </div>
    <div id="whatsappParseMessage" class="message"></div>
    <div class="form-grid">
      <label>顾客姓名（选填）<input id="customer" value=""></label>
      <label>游玩项目（选填）<input id="activity" value=""></label>
      <label>联系电话<input id="phone" value="13800000000" required></label>
      <label>开始时间<input id="startTime" type="time" min="13:00" max="23:00" step="1800" value="15:00" required></label>
      <label>结束时间<input id="endTime" type="time" min="13:00" max="23:00" step="1800" value="18:00" required></label>
      <label>人数<input id="pax" type="number" min="1" max="30" value="6" required></label>
      <label>包间<select id="roomSelect"></select></label>
      <label class="full">状态
        <select id="statusSelect">
          <option value="confirmed">已确认</option>
          <option value="pending">待确认</option>
        </select>
      </label>
    </div>
    <div id="bookingMessage" class="message"></div>
    <div class="dialog-actions">
      <button type="button" class="btn" id="bookingDeleteBtn" style="display:none">删除预约</button>
      <button type="button" class="btn" data-close="bookingDialog">取消</button>
      <button type="submit" class="btn primary" id="bookingSaveBtn">保存预约</button>
    </div>
  </form>
</dialog>

<dialog id="findDialog">
  <form id="findForm" class="dialog-body">
    <div class="dialog-title">
      <div>
        <h2>查找可用包间</h2>
        <p>请输入顾客需要的时间和人数。</p>
      </div>
      <button type="button" class="icon-btn" data-close="findDialog" aria-label="关闭" title="关闭">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false">
          <path d="M4 4L14 14M14 4L4 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="form-grid">
      <label>开始时间<input id="findStart" type="time" min="13:00" max="23:00" value="15:00" step="1800"></label>
      <label>结束时间<input id="findEnd" type="time" min="13:00" max="23:00" value="19:00" step="1800"></label>
      <label class="full">人数<input id="findPax" type="number" min="1" max="30" value="6"></label>
    </div>
    <div class="dialog-actions">
      <button type="submit" class="btn primary">查询包间</button>
    </div>
    <div id="findResults" class="result-list"></div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const state = {
  user: null,
  rooms: [],
  bookings: [],
  authMode: 'login',
  editingBookingId: null,
  viewMode: window.innerWidth <= 720 ? 'list' : 'timeline'
};

const statusLabel = s => ({confirmed:'已确认', pending:'待确认'})[s] || s;
const roomCapacityLabel = r => r.name === '公共区' ? r.name : `${r.name} · ${r.capacity} 人`;
const bookingDialog = $('#bookingDialog');

function setParseMessage(text, kind = 'success') {
  const box = $('#whatsappParseMessage');
  box.className = `message ${kind}`;
  box.textContent = text;
}

function clearParseMessage() {
  const box = $('#whatsappParseMessage');
  box.className = 'message';
  box.textContent = '';
}

function normalizePasteText(text) {
  return String(text || '')
    .replace(/\r/g, '')
    .replace(/：/g, ':')
    .replace(/[　]/g, ' ')
    .trim();
}

function extractLabeledValue(text, label) {
  const patterns = [
    new RegExp(`${label}\\s*:\\s*([^\\n]+)`, 'i'),
    new RegExp(`${label}\\s*[:：]\\s*([^\\n]+)`, 'i')
  ];
  for (const pattern of patterns) {
    const match = text.match(pattern);
    if (match) return match[1].trim();
  }
  return '';
}

function parseDateText(raw) {
  const value = String(raw || '').replace(/\s+/g, '');
  if (!value) return '';
  const match = value.match(/(?:(\d{4})[\/.\-年])?(\d{1,2})[\/.\-月](\d{1,2})/);
  if (!match) return '';
  const year = match[1] ? Number(match[1]) : new Date().getFullYear();
  const first = Number(match[2]);
  const second = Number(match[3]);
  const month = first > 12 ? second : second;
  const day = first > 12 ? first : first;
  const date = new Date(year, month - 1, day);
  if (Number.isNaN(date.getTime()) || date.getMonth() !== month - 1 || date.getDate() !== day) return '';
  return date.toISOString().slice(0, 10);
}

function parseClockText(raw) {
  let value = String(raw || '').trim().toLowerCase();
  if (!value) return '';
  let hasPmPrefix = false;
  if (/^(下午|晚上|中午)/.test(value)) {
    hasPmPrefix = true;
    value = value.replace(/^(下午|晚上|中午)\s*/,'');
  } else if (/^上午/.test(value)) {
    value = value.replace(/^上午\s*/,'');
  }
  const direct = value.match(/^(\d{1,2})(?:[:点时](\d{2}))?\s*(am|pm)?$/i);
  if (!direct) return '';
  let hour = Number(direct[1]);
  const minute = Number(direct[2] || 0);
  const suffix = direct[3] || (hasPmPrefix ? 'pm' : '');
  if (suffix) {
    if (hour === 12) hour = suffix === 'am' ? 0 : 12;
    else if (suffix === 'pm') hour += 12;
  }
  if (hour > 23 || minute > 59) return '';
  return `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
}

function addMinutes(time, minutes) {
  const [hour, minute] = time.split(':').map(Number);
  const total = hour * 60 + minute + minutes;
  const safe = Math.min(total, 23 * 60);
  const hh = Math.floor(safe / 60);
  const mm = safe % 60;
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}

function parseDurationText(raw) {
  const value = String(raw || '').replace(/\s+/g, '').toLowerCase();
  if (!value) return null;
  if (value.includes('无限') || value.includes('unlimited') || value.includes('不限')) {
    return { type: 'unlimited', minutes: null };
  }
  const match = value.match(/(\d+(?:\.\d+)?)小时/);
  if (!match) return null;
  const hours = Number(match[1]);
  if (!Number.isFinite(hours)) return null;
  return { type: 'fixed', minutes: Math.round(hours * 60) };
}

function parseAppointmentTime(text, durationInfo) {
  const normalized = String(text || '').replace(/\s+/g, ' ').trim();
  if (!normalized) return { start: '', end: '', note: '' };
  const lower = normalized.toLowerCase();
  if (lower.includes('unlimited') || lower.includes('无限') || lower.includes('不限')) {
    return { start: '13:00', end: '23:00', note: '已识别为无限时，默认填入 13:00 - 23:00。' };
  }
  const rangeMatch = normalized.match(/(\d{1,2}(?::\d{2})?\s*(?:am|pm)?)\s*(?:-|~|至|到)\s*(\d{1,2}(?::\d{2})?\s*(?:am|pm)?)/i);
  if (rangeMatch) {
    const start = parseClockText(rangeMatch[1]);
    const end = parseClockText(rangeMatch[2]);
    return { start, end, note: '' };
  }
  const start = parseClockText(normalized);
  if (!start) return { start: '', end: '', note: '' };
  if (durationInfo?.type === 'unlimited') {
    return { start, end: '23:00', note: '已识别为无限时，默认填入 23:00 结束。' };
  }
  if (durationInfo?.type === 'fixed' && Number.isFinite(durationInfo.minutes)) {
    return { start, end: addMinutes(start, durationInfo.minutes), note: '' };
  }
  return { start, end: '', note: '' };
}

function parseWhatsappText(text) {
  const normalized = normalizePasteText(text);
  const paxRaw = extractLabeledValue(normalized, '人数');
  const result = {
    activity: extractLabeledValue(normalized, '游玩项目'),
    date: parseDateText(extractLabeledValue(normalized, '预约日期')),
    customer: extractLabeledValue(normalized, '称呼'),
    phone: extractLabeledValue(normalized, '电话号码'),
    pax: '',
    start: '',
    end: '',
    notes: [],
    missing: []
  };

  const timeRaw = extractLabeledValue(normalized, '预约时间');
  const durationRaw = extractLabeledValue(normalized, '套餐') || extractLabeledValue(normalized, '时长');
  const durationInfo = parseDurationText(durationRaw);
  const timeInfo = parseAppointmentTime(timeRaw, durationInfo);
  const paxMatch = String(paxRaw || '').match(/(\d+)/);
  result.pax = paxMatch ? Number(paxMatch[1]) : '';
  result.start = timeInfo.start;
  result.end = timeInfo.end;
  if (timeInfo.note) result.notes.push(timeInfo.note);

  if (!result.activity) result.missing.push('游玩项目');
  if (!result.date) result.missing.push('预约日期');
  if (!result.pax) result.missing.push('人数');
  if (!result.start) result.missing.push('预约时间');
  if (!result.end) result.missing.push('结束时间');
  if (!result.phone) result.missing.push('电话号码');
  return result;
}

function resetBookingForm() {
  $('#bookingDialogTitle').textContent = '新增预约';
  $('#bookingSaveBtn').textContent = '保存预约';
  $('#bookingDeleteBtn').style.display = 'none';
  $('#bookingMessage').className = 'message';
  $('#bookingMessage').textContent = '';
  clearParseMessage();
  $('#whatsappPaste').value = '';
  $('#customer').value = '';
  $('#activity').value = '';
  $('#phone').value = '13800000000';
  $('#startTime').value = '15:00';
  $('#endTime').value = '18:00';
  $('#pax').value = '6';
  $('#statusSelect').value = 'confirmed';
  if ($('#roomSelect').options.length) {
    $('#roomSelect').selectedIndex = 0;
  }
  state.editingBookingId = null;
}

function openNewBookingDialog() {
  resetBookingForm();
  bookingDialog.showModal();
}

function openEditBookingDialog(booking) {
  state.editingBookingId = booking.id;
  $('#bookingDialogTitle').textContent = '编辑预约';
  $('#bookingSaveBtn').textContent = '保存修改';
  $('#bookingDeleteBtn').style.display = 'inline-flex';
  $('#bookingMessage').className = 'message';
  $('#bookingMessage').textContent = '';
  clearParseMessage();
  $('#whatsappPaste').value = '';
  $('#customer').value = booking.customer || '';
  $('#activity').value = booking.activity || '';
  $('#phone').value = booking.phone || '';
  $('#startTime').value = booking.start;
  $('#endTime').value = booking.end;
  $('#pax').value = booking.pax;
  $('#roomSelect').value = String(booking.roomId);
  $('#statusSelect').value = booking.status;
  bookingDialog.showModal();
}

bookingDialog.addEventListener('close', resetBookingForm);

const api = async (url, options = {}) => {
  const res = await fetch(url, {
    credentials: 'include',
    headers: {
      'Content-Type': 'application/json',
      ...(options.headers || {})
    },
    ...options
  });
  const text = await res.text();
  let data = {};
  if (text) {
    try { data = JSON.parse(text); } catch { data = { raw: text }; }
  }
  if (!res.ok) {
    throw new Error(data.error || '请求失败');
  }
  return data;
};

const toMin = t => {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
};

const fmt = t => {
  const [h, m] = t.split(':').map(Number);
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
};

const overlap = (a, b, c, d) => toMin(a) < toMin(d) && toMin(b) > toMin(c);

function setAuthMode(mode) {
  state.authMode = mode;
  $('#loginTab').classList.toggle('active', mode === 'login');
  $('#registerTab').classList.toggle('active', mode === 'register');
  $('#authTitle').textContent = mode === 'login' ? '登录' : '注册';
  $('#authHint').textContent = mode === 'login'
    ? '登录后可以保存和查看自己的预约数据。'
    : '注册新账户后会自动登录。';
  $('#authSubmit').textContent = mode === 'login' ? '登录' : '注册并登录';
  $('#authConfirmWrap').style.display = mode === 'register' ? 'block' : 'none';
  $('#authPassword2').required = mode === 'register';
}

function openAuth(mode) {
  $('#authMessage').className = 'message';
  $('#authMessage').textContent = '';
  setAuthMode(mode);
  if (!$('#authDialog').open) {
    $('#authDialog').showModal();
  }
}

function syncAuthUI() {
  const loggedIn = !!state.user;
  $('#authStatus').textContent = loggedIn ? `?????${state.user.username}` : '???';
  $('#loginBtn').style.display = loggedIn ? 'none' : 'inline-flex';
  $('#registerBtn').style.display = loggedIn ? 'none' : 'inline-flex';
  $('#logoutBtn').style.display = loggedIn ? 'inline-flex' : 'none';
  $('#newBtn').disabled = !loggedIn;
  $('#findBtn').disabled = !loggedIn;
  $('#actionsBar').style.display = loggedIn ? '' : 'none';
  $('#summaryCards').style.display = loggedIn ? '' : 'none';
  $('#timelineCard').style.display = loggedIn ? '' : 'none';

  if (!loggedIn) {
    openAuth('login');
  }
}

function setDbStatus(kind, text) {
  const el = $('#dbStatus');
  el.className = `chip status-chip ${kind}`;
  el.textContent = text;
}

function syncViewSwitch() {
  $('#timelineViewBtn').classList.toggle('active', state.viewMode === 'timeline');
  $('#listViewBtn').classList.toggle('active', state.viewMode === 'list');
}

function populateRoomSelect() {
  $('#roomSelect').innerHTML = '';
  state.rooms.forEach(r => {
    const o = document.createElement('option');
    o.value = r.id;
    o.textContent = roomCapacityLabel(r);
    $('#roomSelect').appendChild(o);
  });
}

async function loadBookings() {
  if (!state.user) {
    state.bookings = [];
    return;
  }
  const date = $('#dateInput').value;
  const data = await api(`/api/bookings?date=${encodeURIComponent(date)}`);
  state.bookings = data.bookings || [];
}

async function refreshAll() {
  await loadBookings();
  render();
}

function renderListView(day) {
  return `<div class="list-view">${state.rooms.map(r => {
    const roomBookings = day
      .filter(b => b.roomId === r.id)
      .sort((a, b) => toMin(a.start) - toMin(b.start));
    return `<section class="list-room">
      <div class="list-room-head">
        <div><b>${r.name}</b><span>${r.name === '公共区' ? '开放座位' : `${r.capacity} 人房`}</span></div>
        <span>${roomBookings.length ? `${roomBookings.length} 条预约` : '空闲'}</span>
      </div>
      ${roomBookings.length ? `<div class="list-bookings">${roomBookings.map(b => {
        const displayPhone = b.phone || b.customer;
        const activity = b.activity ? ` · ${b.activity}` : '';
        return `<button type="button" class="list-booking ${b.status}" data-booking-id="${b.id}">
          <strong>${displayPhone}</strong>
          <span>${fmt(b.start)} - ${fmt(b.end)} · ${statusLabel(b.status)}${activity}</span>
        </button>`;
      }).join('')}</div>` : '<div class="list-empty">暂无预约</div>'}
    </section>`;
  }).join('')}</div>`;
}

function renderEmptyState(message, options = {}) {
  const { title = '请先登录', actions = false } = options;
  return `<div class="empty-state">
    <div class="empty-card">
      <strong>${title}</strong>
      <p>${message}</p>
      ${actions ? `<div class="empty-actions">
        <button type="button" class="btn primary" data-empty-auth="login">登录</button>
        <button type="button" class="btn" data-empty-auth="register">注册</button>
      </div>` : ''}
    </div>
  </div>`;
}

function bindTimelineActions() {
  document.querySelectorAll('[data-booking-id]').forEach(btn => {
    btn.onclick = () => {
      const booking = state.bookings.find(item => String(item.id) === btn.dataset.bookingId);
      if (booking) {
        openEditBookingDialog(booking);
      }
    };
  });

  document.querySelectorAll('[data-empty-auth]').forEach(btn => {
    btn.onclick = () => openAuth(btn.dataset.emptyAuth);
  });
}

function render() {
  syncViewSwitch();
  if (!state.user) {
    $('#bookingCount').textContent = '0';
    $('#availableRooms').textContent = '0';
    $('#nextEnding').textContent = '—';
    $('#timeline').innerHTML = '';
    return;
  }

  const date = $('#dateInput').value;
  const day = state.bookings.filter(b => b.date === date);
  $('#bookingCount').textContent = day.length;
  $('#availableRooms').textContent = state.rooms.filter(r => !day.some(b => b.roomId === r.id)).length;

  const ending = [...day].sort((a, b) => toMin(a.end) - toMin(b.end))[0];
  $('#nextEnding').textContent = ending ? `${state.rooms.find(r => r.id === ending.roomId)?.name || '未知包间'} · ${fmt(ending.end)}` : '—';

  if (state.viewMode === 'list') {
    $('#timeline').innerHTML = renderListView(day);
    bindTimelineActions();
    return;
  }

  let html = `<div class="grid-row" style="min-height:auto">
    <div class="room-label"><b>区域</b></div>
    <div class="time-head">
      ${Array.from({length:11}, (_, i) => `<div${i === 10 ? ' class="end-label"' : ''}>${String(i + 13).padStart(2, '0')}:00</div>`).join('')}
    </div>
  </div>`;

  const start = 13 * 60;
  const total = 11 * 60;
  state.rooms.forEach(r => {
    html += `<div class="grid-row">
      <div class="room-label"><b>${r.name}</b><span>${r.name === '公共区' ? '' : `${r.capacity} 人`}</span></div>
      <div class="track">`;

    day.filter(b => b.roomId === r.id).forEach(b => {
      const left = ((toMin(b.start) - start) / total) * 100;
      const width = ((toMin(b.end) - toMin(b.start)) / total) * 100;
      const displayPhone = b.phone || b.customer;
      const activity = b.activity ? ` · ${b.activity}` : '';
      html += `<button type="button" class="booking ${b.status}" data-booking-id="${b.id}" style="left:${left}%;width:${width}%"
        title="${displayPhone}${activity} · ${fmt(b.start)} - ${fmt(b.end)} · ${b.pax} 人">
        <strong>${displayPhone}</strong><span>${fmt(b.start)} - ${fmt(b.end)} · ${statusLabel(b.status)}${activity}</span></button>`;
    });

    html += `</div></div>`;
  });

  $('#timeline').innerHTML = html;
  bindTimelineActions();
}

async function bootstrap() {
  setDbStatus('status-warn', '???????');

  try {
    const health = await api('/api/health');
    if (health.ok) {
      setDbStatus('status-ok', health.message || '??????? Supabase');
    } else {
      setDbStatus('status-warn', health.message || '??????');
    }
  } catch (error) {
    setDbStatus('status-error', `????${error.message}`);
  }

  state.rooms = (await api('/api/rooms')).rooms || [];
  populateRoomSelect();

  const me = await api('/api/me');
  state.user = me.user || null;
  syncAuthUI();
  if (state.user) {
    await loadBookings();
  }
  render();
}

function requireLoginOrOpenAuth() {
  if (!state.user) {
    openAuth('login');
    return false;
  }
  return true;
}

$('#timelineViewBtn').onclick = () => {
  state.viewMode = 'timeline';
  render();
};
$('#listViewBtn').onclick = () => {
  state.viewMode = 'list';
  render();
};

window.addEventListener('resize', () => {
  const nextMode = window.innerWidth <= 720 ? 'list' : 'timeline';
  if (nextMode !== state.viewMode && !state.user) {
    state.viewMode = nextMode;
    syncViewSwitch();
  }
});
$('#dateInput').onchange = () => {
  if (state.user) {
    loadBookings().then(render).catch(err => alert(err.message));
  } else {
    render();
  }
};

$('#newBtn').onclick = () => {
  if (!requireLoginOrOpenAuth()) return;
  openNewBookingDialog();
};
$('#findBtn').onclick = () => {
  if (!requireLoginOrOpenAuth()) return;
  $('#findDialog').showModal();
};

$('#loginBtn').onclick = () => openAuth('login');
$('#registerBtn').onclick = () => openAuth('register');
$('#logoutBtn').onclick = async () => {
  await api('/api/logout', { method: 'POST', body: '{}' });
  state.user = null;
  state.bookings = [];
  syncAuthUI();
  render();
};

document.querySelectorAll('[data-close]').forEach(b => {
  b.onclick = () => {
    $('#' + b.dataset.close).close();
    if (b.dataset.close === 'bookingDialog') {
      resetBookingForm();
    }
  };
});

$('#loginTab').onclick = () => setAuthMode('login');
$('#registerTab').onclick = () => setAuthMode('register');

$('#whatsappParseBtn').onclick = () => {
  const parsed = parseWhatsappText($('#whatsappPaste').value);
  const fields = [];

  if (parsed.activity) {
    $('#activity').value = parsed.activity;
    fields.push('游玩项目');
  }
  if (parsed.date) {
    $('#dateInput').value = parsed.date;
    fields.push('预约日期');
  }
  if (parsed.customer) {
    $('#customer').value = parsed.customer;
    fields.push('顾客姓名');
  }
  if (parsed.phone) {
    $('#phone').value = parsed.phone;
    fields.push('联系电话');
  }
  if (parsed.pax) {
    $('#pax').value = parsed.pax;
    fields.push('人数');
  }
  if (parsed.start) {
    $('#startTime').value = parsed.start;
    fields.push('开始时间');
  }
  if (parsed.end) {
    $('#endTime').value = parsed.end;
    fields.push('结束时间');
  }

  const parts = [];
  if (fields.length) parts.push(`已识别：${fields.join('、')}。`);
  if (parsed.notes.length) parts.push(parsed.notes.join(' '));
  if (parsed.missing.length) {
    parts.push(`未找到：${parsed.missing.join('、')}。`);
    setParseMessage(parts.join(' '), 'error');
    return;
  }

  setParseMessage(parts.join(' ') || '未识别到可用字段。', fields.length ? 'success' : 'error');
};

$('#authForm').onsubmit = async e => {
  e.preventDefault();
  const username = $('#authUsername').value.trim();
  const password = $('#authPassword').value;
  const password2 = $('#authPassword2').value;
  const msg = $('#authMessage');
  msg.className = 'message';

  try {
    if (state.authMode === 'register') {
      if (password !== password2) {
        throw new Error('两次输入的密码不一致。');
      }
      const data = await api('/api/register', {
        method: 'POST',
        body: JSON.stringify({ username, password })
      });
      state.user = data.user;
    } else {
      const data = await api('/api/login', {
        method: 'POST',
        body: JSON.stringify({ username, password })
      });
      state.user = data.user;
    }

    $('#authDialog').close();
    syncAuthUI();
    await loadBookings();
    render();
  } catch (error) {
    msg.textContent = error.message;
    msg.classList.add('error');
  }
};

$('#bookingForm').onsubmit = async e => {
  e.preventDefault();
  if (!state.user) {
    openAuth('login');
    return;
  }

  const payload = {
    date: $('#dateInput').value,
    customer: $('#customer').value.trim(),
    activity: $('#activity').value.trim(),
    phone: $('#phone').value.trim(),
    start: $('#startTime').value,
    end: $('#endTime').value,
    pax: Number($('#pax').value),
    roomId: Number($('#roomSelect').value),
    status: $('#statusSelect').value
  };

  const msg = $('#bookingMessage');
  msg.className = 'message';

  try {
    if (!payload.phone || !payload.start || !payload.end || toMin(payload.end) <= toMin(payload.start)) {
      throw new Error('请输入有效的电话和时间范围。');
    }

    if (state.editingBookingId) {
      await api(`/api/bookings/${state.editingBookingId}`, {
        method: 'PUT',
        body: JSON.stringify(payload)
      });
    } else {
      await api('/api/bookings', {
        method: 'POST',
        body: JSON.stringify(payload)
      });
    }

    $('#bookingDialog').close();
    resetBookingForm();
    await loadBookings();
    render();
  } catch (error) {
    msg.textContent = error.message;
    msg.classList.add('error');
  }
};

$('#bookingDeleteBtn').onclick = async () => {
  if (!state.editingBookingId) return;
  if (!confirm('确定要删除这条预约吗？')) return;
  try {
    await api(`/api/bookings/${state.editingBookingId}`, { method: 'DELETE', body: '{}' });
    $('#bookingDialog').close();
    resetBookingForm();
    await loadBookings();
    render();
  } catch (error) {
    const msg = $('#bookingMessage');
    msg.className = 'message error';
    msg.textContent = error.message;
  }
};

$('#findForm').onsubmit = e => {
  e.preventDefault();
  if (!state.user) {
    openAuth('login');
    return;
  }

  const start = $('#findStart').value;
  const end = $('#findEnd').value;
  const pax = Number($('#findPax').value);
  const date = $('#dateInput').value;
  const box = $('#findResults');

  if (!start || !end || toMin(end) <= toMin(start)) {
    box.innerHTML = '<div class="result">时间范围无效</div>';
    return;
  }

  const available = state.rooms.filter(r => r.capacity >= pax && !state.bookings.some(b => b.date === date && b.roomId === r.id && overlap(start, end, b.start, b.end)));
  box.innerHTML = available.length
    ? available.map(r => `<div class="result"><div><b>${r.name}</b><div style="font-size:12px;color:#6b7280">${r.name === '公共区' ? '公共区域' : `可容纳 ${r.capacity} 人`}</div></div><span class="badge">可用</span></div>`).join('')
    : '<div class="result">当前没有可用包间</div>';
};

setAuthMode('login');
syncAuthUI();
bootstrap().catch(err => {
  console.error(err);
  $('#timeline').innerHTML = renderEmptyState(`初始化失败：${err.message}`, { title: '加载失败' });
});
</script>
</body>
</html>
